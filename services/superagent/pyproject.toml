[project]
name = "superagent"
version = "0.1.0"
description = "Orcha SuperAgent — LangGraph ReAct orchestration runtime"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "pydantic-settings>=2.15.0",
  "langchain-core>=1.2.22",
  "langchain-google-genai>=2",
  "langchain-openai>=1.0.0",
  "langgraph>=1.1.3",
  "langgraph-checkpoint-redis>=0.1",
  "redis>=5",
  "openai>=2.29.0",
  "playwright>=1.49",
  "boto3>=1.35",
  "httpx[http2]>=0.27",
  "httpx-sse>=0.4",
  "mcp>=1",
  "sentence-transformers>=3",
  "jsonschema>=4",
  "cryptography>=42",
  "cdv==1.0.1",
  "asyncpg>=0.29",
  "prisma>=0.15",
  "common-database",
  "common-pricing",
  "common-utils",
  "emerge-tools",
  "internal-commons",
]

[tool.uv.sources]
common-database = {workspace = true}
common-pricing = {workspace = true}
common-utils = {workspace = true}
emerge-tools = {workspace = true}
internal-commons = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
