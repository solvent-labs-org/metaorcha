[project]
name = "gateway"
version = "0.1.0"
description = "Orcha Gateway — public ingress, JWT auth, SSE relay, session management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.29",
  "pydantic[email]>=2",
  "pydantic-settings>=2",
  "httpx[http2]>=0.27",
  "redis>=5",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4",
  "apscheduler>=3.10.0",
  "svix>=1.0",
  "privy-client",
  "boto3>=1.43.65",
  "common-database",
  "common-utils",
  "internal-commons",
]

[tool.uv.sources]
common-database = {workspace = true}
common-utils = {workspace = true}
internal-commons = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
