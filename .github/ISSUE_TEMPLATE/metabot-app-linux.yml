name: MetaBot app on Linux
description: Something in the MetaBot app (apps/metabot-app) isn't working on Linux.
labels: ["bug", "os:linux"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The checklist in apps/metabot-app/CONTRIBUTING-linux.md lists what helps.
        A `metabot-app doctor --json` report is coming in the first preview; until then, paste the versions below.
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The output of these commands, run where the app runs.
      placeholder: |
        $ metabot-app --version
        $ python3 --version
        $ tmux -V
        $ node --version
        $ uname -srm
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead. Include any error the app or the terminal showed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, keys and anything private before pasting.
      render: shell
