  # ============================================================================
  # Dependency vulnerabilities — osv-scanner over every lockfile.
  #
  # osv-scanner.toml and frontend/osv-scanner.toml already existed, each with a
  # documented IgnoredVulns entry — but nothing ever ran the scanner, so the
  # ignore lists were the only part of the mechanism that worked.
  # ============================================================================
  osv-scan:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=uv.lock
            --lockfile=frontend/package-lock.json
            --lockfile=agents/google-workspace-orchestrator/uv.lock
            --lockfile=agents/finance-dashboard-agent/uv.lock

  # ============================================================================
  # CI complete — the single required status check.
  #
  # Path-filtered jobs report "skipped", and a required check that never runs
  # blocks a PR forever. That is why `detect-changes` was the only required
  # context — but it has no tests and effectively cannot fail, so nothing
  # actually gated a merge. This job always runs, so it is safe to require, and
  # it fails if any job it waits on failed or was cancelled.
  # ============================================================================
  ci-complete:
    # NOTE: branch protection matches the check run's REPORTED NAME, not the job
    # id, and it matches exact-case. This `name:` must therefore stay identical
    # to the required status check configured on `main` (`ci-complete`).
    # Renaming it to anything prettier makes the required context unreachable and
    # `main` unmergeable by everyone, admins included. That is not hypothetical:
    # it happened on 2026-08-24 and went unnoticed for two days.
    name: ci-complete
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - detect-changes
      - registry-service
      - common-packages
      - planning-discovery-service
      - sdk
      - superagent-service
      - emerge-node
      - validator
      - manifest-validate
      - gateway-service
      - frontend
      - osv-scan
    steps:
      - name: Verify no upstream job failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::a required CI job failed"
            exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::a required CI job was cancelled"
            exit 1
          fi
          echo "All CI jobs passed or were skipped by path filters."
