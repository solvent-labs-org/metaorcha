name: Scorecard supply-chain security

# OpenSSF Scorecard — security health metrics, published so the README badge
# auto-updates. Pattern adopted from traycerai/traycer (Apache 2.0).
# https://scorecard.dev
on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard publishes results + badge only for the public repo — skip on forks.
    if: ${{ github.repository == 'solvent-labs-org/metaorcha' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # job-level permissions REPLACE the top-level read-all
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results (badge + API)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # The default GITHUB_TOKEN cannot read branch-protection settings, so
          # that check reports "-1 / unknown" rather than a score. A classic PAT
          # with public_repo scope, stored as SCORECARD_TOKEN, lets it evaluate.
          # Optional: without the secret the run still succeeds, minus that check.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          sarif_file: results.sarif
