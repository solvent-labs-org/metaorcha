name: Publish orcha-sdk

# Release the `orcha-sdk` package to PyPI. Two ways to run:
#   • Tag push (real publish):   git tag sdk-v0.1.1 && git push <remote> sdk-v0.1.1
#   • Manual dry-run (no upload): Actions → this workflow → "Run workflow"
#
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in this repo.
#
# ⚠ REQUIRED one-time setup, on pypi.org, by the repo owner. Until this is done
# the publish job fails with `invalid-publisher: valid token, but no
# corresponding publisher` — which is exactly what happened to run 30928599557
# (tag sdk-v0.1.0, 2026-08-04, orcha-internal): nothing was ever uploaded.
#   1. Add a PyPI *pending publisher* for project name "orcha-sdk" (works
#      before the project exists), or create the project first.
#   2. Trusted publisher claims must match the repo the TAG IS PUSHED TO.
#      Post-rename (2026-08-17) that is:
#      owner=solvent-labs-org, repo=metaorcha (public)  — or —
#      owner=solvent-labs-org, repo=metaorcha-internal (internal),
#      workflow=publish-sdk.yml, environment=pypi
#      The previous attempt failed on precisely this mismatch — the tag went to
#      the internal repo while the publisher was documented for the public one.
on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch: {} # dry-run: build + verify + smoke, never publishes

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # On a tag push, the tag version (sdk-vX.Y.Z) must match sdk/pyproject.toml,
      # otherwise the wheel PyPI receives is named differently from the git tag.
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PY_VERSION="$(grep -m1 '^version' sdk/pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG_VERSION pyproject=$PY_VERSION"
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "::error::tag sdk-v$TAG_VERSION != sdk/pyproject.toml version $PY_VERSION"
            exit 1
          fi

      - name: Build
        working-directory: sdk
        run: uv build -o dist

      - name: Check metadata
        run: uvx twine check sdk/dist/*

      - name: Smoke test wheel in isolation
        run: |
          WHEEL="$(ls sdk/dist/*.whl)"
          mkdir -p /tmp/sdk-smoke && cd /tmp/sdk-smoke
          uvx --from "$GITHUB_WORKSPACE/$WHEEL" orcha-sdk init smoke-agent
          test -f smoke-agent/agent.py
          cd smoke-agent
          uvx --from "$GITHUB_WORKSPACE/$WHEEL" orcha-sdk run --no-register &
          RUN_PID=$!
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8900/health && break || sleep 1
          done
          curl -sf http://localhost:8900/health
          kill -0 "$RUN_PID"
          kill "$RUN_PID"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orcha-sdk-dist
          path: sdk/dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Only a tag push publishes; workflow_dispatch stops after build (dry-run).
    #
    # The repository guard is not decoration. This workflow exists on both the
    # internal and the public repo, and fires on whichever one receives the tag.
    # Creating the release (below) is new behaviour — previously an internal tag
    # emitted a `::warning::` and stopped — so without this, a `sdk-v*` tag
    # pushed here would mint a real GitHub release on the internal repo, which
    # `docs/releasing.md` §2 forbids outright: the public repo owns every
    # release number. Same `github.repository ==` guard used by codeql.yml and
    # scorecard.yml.
    if: >-
      startsWith(github.ref, 'refs/tags/sdk-v') &&
      github.repository == 'solvent-labs-org/metaorcha'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing + provenance
      contents: write # attach artifacts to the GitHub release
      attestations: write # record build provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orcha-sdk-dist
          path: dist/

      # Provenance ties the wheel and sdist back to the commit and workflow that
      # built them, verifiable with `gh attestation verify`. Worth more than the
      # supply-chain checkbox it satisfies for something people uvx-install.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # Declared rather than left to the action's default: the SHA pin
          # freezes that default at this revision.
          attestations: true

      # The attest step above uploads to GitHub's attestation store, which is
      # what `gh attestation verify` reads -- but a store is not a release.
      # Anything auditing the tag itself reads the release's own assets, and a
      # wheel carries no signature of its own, so the artifacts and the proof of
      # how they were built have to travel together.
      #
      # This runs *after* the PyPI publish deliberately: that step is pointed at
      # `packages-dir: dist/` and twine rejects a stray non-package file, so the
      # bundle must not exist in dist/ until the upload is done.
      #
      # `.sigstore.json` is what the file is -- a JSON-serialized Sigstore
      # bundle. Deliberately not named `.intoto.jsonl`, which means SLSA
      # provenance in JSON Lines: a different format that happens to score
      # higher with supply-chain scanners. The name should describe the bytes.
      - name: Stage the attestation bundle as a release asset
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
             "dist/orcha-sdk-${GITHUB_REF_NAME#sdk-v}.sigstore.json"

      # Releases carried no assets at all, so there was nothing for a consumer
      # (or a supply-chain audit) to verify against the tag.
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The SDK's artifacts belong to the SDK's own tag. Stripping `sdk-`
          # named a release on the *platform* train instead: `sdk-v0.1.2`
          # resolves to `v0.1.2`, a release cut months earlier for something
          # entirely different, and `gh release upload --clobber` would have
          # attached the wheels to it and exited 0. Nothing was ever misfiled
          # — no release on this repo carries an asset — so this is the shape the
          # next `sdk-v*` push would have taken, not damage to undo.
          VERSION="${GITHUB_REF_NAME#sdk-v}"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A tag push creates no release. Warning and stopping here would
            # leave this step a permanent no-op, which is why the tags have no
            # artifacts to verify against in the first place. `--verify-tag`
            # refuses to invent a release for a tag that does not exist.
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "orcha-sdk $VERSION" \
              --notes "\`orcha-sdk\` $VERSION on PyPI: https://pypi.org/project/orcha-sdk/$VERSION/"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # The check that matters: run the command the README tells users to type,
  # resolved from the real index. Every other smoke test here uses `--from`
  # against a local wheel, which is why a README line pointing at an unrelated
  # PyPI package survived four releases.
  verify-published:
    name: Verify the documented command from PyPI
    needs: publish
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Wait for the index to serve the new version
        run: |
          VERSION="${GITHUB_REF_NAME#sdk-v}"
          for _ in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/orcha-sdk/$VERSION/json" >/dev/null; then
              echo "orcha-sdk $VERSION is live"; exit 0
            fi
            sleep 10
          done
          echo "::error::orcha-sdk $VERSION never appeared on PyPI"; exit 1

      - name: uvx orcha-sdk init — exactly as documented
        run: |
          mkdir -p /tmp/pypi-smoke && cd /tmp/pypi-smoke
          uvx orcha-sdk init my-agent
          test -f my-agent/agent.py
