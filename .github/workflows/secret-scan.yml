name: Secret scan

# Continuous secret scanning on every PR and push to main — catches accidental
# commits of credentials before they reach a release. Invokes the gitleaks CLI
# (MIT, free for everyone) directly instead of gitleaks-action@v2, which
# requires a paid license for GitHub organizations. Known-safe false positives
# (public test fixtures / mock values) are allowlisted in .gitleaks.toml at
# the repo root. Pattern adopted from traycerai/traycer (Apache 2.0).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Pinning the version alone still trusts whatever bytes the release
          # URL serves. Verify the tarball before extracting it — the scanner
          # that guards our secrets is exactly the wrong thing to run unchecked.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --no-banner --redact --verbose
