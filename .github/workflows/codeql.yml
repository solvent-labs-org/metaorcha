name: CodeQL

# SAST on every push/PR to main plus a weekly sweep. Python covers the
# services/SDK; javascript-typescript covers the frontend and JS agents.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "24 3 * * 4"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning is free on public repos but needs Advanced Security (paid)
    # on private ones. On metaorcha-internal the analysis runs fine and then
    # fails at the upload with "Advanced Security must be enabled", which made
    # this a permanently-red check on every PR. Skip where it cannot report;
    # the public export is where the results are actually visible.
    #
    # Guard on the repository name, not `repository.private`: the `schedule`
    # payload does not carry a repository object, so `null == false` coerces
    # true and the weekly cron would run — and fail — on the internal repo.
    if: github.repository == 'solvent-labs-org/metaorcha'
    runs-on: ubuntu-latest
    permissions:
      actions: read # required for private repos; harmless on public
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          category: "/language:${{ matrix.language }}"
