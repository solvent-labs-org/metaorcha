name: MetaBot app

# The app's own CI (apps/metabot-app). The OS jobs call only Makefile targets, the same
# ones the contributing guides give; apps/metabot-app/tests/test_contributing.py fails
# if this file and the guides drift apart. Every action is pinned by SHA, copied from
# ci.yml and secret-scan.yml.

on:
  push:
    paths:
      - "apps/metabot-app/**"
      - ".github/workflows/metabot-app.yml"
  pull_request:
    # `labeled` so that adding the macos-ci label starts the macOS job
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/metabot-app/**"
      - ".github/workflows/metabot-app.yml"
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the macOS job (the suite does not pass there yet; December)"
        type: boolean
        default: false
      android:
        description: "Also run the Android job (build.sh test + a full signed APK)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (make test-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      METABOT_SRC: ${{ github.workspace }}/apps/metabot/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      # test_extend runs its real-MetaBot tests only when METABOT_PYTHON exists and
      # METABOT_SRC holds the metabot package; install this tree's MetaBot and SDK
      # so those tests run here and never skip.
      - name: MetaBot venv
        run: |
          uv venv --no-project --python 3.12 "$RUNNER_TEMP/metabot"
          uv pip install --python "$RUNNER_TEMP/metabot/bin/python" -e ./sdk -e ./apps/metabot

      - name: make test-linux
        env:
          METABOT_PYTHON: ${{ runner.temp }}/metabot/bin/python
        run: make -C apps/metabot-app test-linux

      # Stream T: the self-test journeys against this tree's server and core, in a
      # loopback-only network namespace when the runner allows one. The report is
      # kept whatever the verdict; the verdict is the step's exit code.
      - name: make selftest-linux
        env:
          METABOT_PYTHON: ${{ runner.temp }}/metabot/bin/python
          SELFTEST_OUT: ${{ runner.temp }}/selftest
        run: make -C apps/metabot-app selftest-linux

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: selftest-linux-report
          path: ${{ runner.temp }}/selftest/**/report.*
          if-no-files-found: ignore

  # macOS runner minutes are the maintainers' call: this job runs only on a manual dispatch,
  # or on a pull request that carries the `macos-ci` label. It never runs on a push.
  # A dispatch runs it only when its `macos` input is on, so a bundle dispatch stays
  # green while the suite's macOS failures (paths under /private, timing) are open.
  macos:
    name: macOS (make test-macos)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.macos == true) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'macos-ci'))
    runs-on: macos-15
    timeout-minutes: 30
    env:
      METABOT_SRC: ${{ github.workspace }}/apps/metabot/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      - name: MetaBot venv
        run: |
          uv venv --no-project --python 3.12 "$RUNNER_TEMP/metabot"
          uv pip install --python "$RUNNER_TEMP/metabot/bin/python" -e ./sdk -e ./apps/metabot

      - name: make test-macos
        env:
          METABOT_PYTHON: ${{ runner.temp }}/metabot/bin/python
        run: make -C apps/metabot-app test-macos

  # The E1 on-device payload, proven end to end: the JVM tests (lock and manifest
  # parsers), the lock-driven assembly (the CPython tarball and PyPI wheels download
  # on the runner's cold cache and are verified against packaging/android-wheels.lock),
  # and a full APK build — stored, page-aligned native libraries, the whole-APK strings
  # check, the 60 MB cap. Signed with a throwaway per-run keystore (release signing
  # stays local); the APK is kept as an artifact for a device install. Gated like the
  # macOS job — a dispatch's `android` input or the `android-ci` label — never a push.
  android:
    name: Android (build.sh test + APK)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.android == true) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'android-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MB_CORE_ROOT: ${{ github.workspace }}
      MB_UV_OFFLINE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: JVM tests (pairing, WheelLock, PayloadAssets)
        run: apps/metabot-app/android/build.sh test

      - name: Build the APK (throwaway CI keystore)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export MB_OUT="$RUNNER_TEMP/apk"
          export MB_KEYSTORE="$RUNNER_TEMP/ci-debug.p12" MB_KS_PASS MB_KEY_PASS
          MB_KS_PASS=$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')
          MB_KEY_PASS="$MB_KS_PASS"
          keytool -genkeypair -keystore "$MB_KEYSTORE" -storetype PKCS12 -alias ci \
            -keyalg RSA -keysize 2048 -validity 7 \
            -storepass:env MB_KS_PASS -keypass:env MB_KEY_PASS \
            -dname "CN=MetaBot CI debug, O=ci"
          apps/metabot-app/android/build.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metabot-app-android-arm64-v8a
          path: ${{ runner.temp }}/apk/ai.metaorcha.metabot.apk
          retention-days: 7

  # Every commit in the pull request is signed off by its author (`git commit -s`).
  # A script in this repo, not a third-party app.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/check_dco.py "${BASE_SHA}..${HEAD_SHA}"

  # D3: the offline wheelhouse, built for real on every change (the unit tests only dry-run
  # it). Builds the sdk, the core and the app as wheels, downloads the locked dependency set
  # as wheels for linux-x86_64, writes requirements.lock, then proves that a fresh venv
  # installs from that folder alone: no index, every hash checked. The folder is what the
  # Linux desktop bundle packs. macOS gets its own job on a macOS runner when that bundle
  # ships (pip evaluates the lock's markers against the interpreter that runs it).
  bundle-linux:
    name: Desktop bundle (make desktop-test, deb + AppImage)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'bundle-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Tauri's Linux libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: The shell core's tests and the crate's structural tests
        run: make -C apps/metabot-app desktop-test PYTHON=python3

      - name: Build the bundles
        run: |
          cargo install tauri-cli --version '^2' --locked
          cd apps/metabot-app/desktop/src-tauri
          cargo tauri build --bundles deb,appimage
          ls target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage

      - name: Smoke the binary (no window, a fake server on PATH)
        run: xvfb-run -a apps/metabot-app/tools/desktop-smoke.sh apps/metabot-app/desktop/src-tauri/target/release/metabot-desktop

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metabot-desktop-linux-x86_64
          path: |
            apps/metabot-app/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/metabot-app/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  wheelhouse-linux:
    name: Wheelhouse (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build the wheels and download the locked set
        run: |
          python3 apps/metabot-app/packaging/wheelhouse.py --platform linux-x86_64 --python 3.12 --out "$RUNNER_TEMP/wheels"
          ls "$RUNNER_TEMP/wheels"/orcha_sdk-*.whl "$RUNNER_TEMP/wheels"/orcha_metabot-*.whl "$RUNNER_TEMP/wheels"/metaorcha_app-*.whl
          wc -l "$RUNNER_TEMP/wheels/requirements.lock"

      - name: Install from the folder alone, hashes required
        run: |
          python3 -m venv "$RUNNER_TEMP/offline"
          "$RUNNER_TEMP/offline/bin/python" -m pip install --quiet --no-index --find-links "$RUNNER_TEMP/wheels" --require-hashes -r "$RUNNER_TEMP/wheels/requirements.lock"
          "$RUNNER_TEMP/offline/bin/metabot" --version
          "$RUNNER_TEMP/offline/bin/metabot-app" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheelhouse-linux-x86_64
          path: ${{ runner.temp }}/wheels
          retention-days: 7
