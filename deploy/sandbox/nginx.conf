events {
    worker_connections 1024;
}

http {
    # Real client IP: cloudflared fronts this stack, so $remote_addr is the
    # connector. Trust only loopback and docker bridge ranges to set it —
    # anything else cannot spoof CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Rate limit zones (keyed on the real client IP once resolved above)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    limit_req_status 429;

    # Logging
    log_format main '$remote_addr - $request [$time_local] $status';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # JSON body for rate-limited API clients instead of an empty 429
        error_page 429 @ratelimited;
        location @ratelimited {
            default_type application/json;
            return 429 '{"error":"rate_limited","retry_after":60}';
        }

        # Frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
        }

        # Auth endpoints — frontend BASE_URL=/api calls /api/auth/*
        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            rewrite ^/api/auth/(.*) /auth/$1 break;
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Direct /auth/* (origin-relative frontend) — gateway serves these natively.
        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API — 10 req/min per IP
        # No trailing "/" on proxy_pass: the full URI (including the /api
        # prefix) is forwarded — gateway session routes live at /api/v1/*.
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE — long-lived connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
