identity:
  id: "did:orcha:agent:notion-mcp"
  name: "Notion MCP"
  version: "2.0.0"
  description: "Notion workspace CRUD via MCP — search, create, update pages and query databases"
  tags: ["notion", "mcp", "productivity", "knowledge-management", "crud"]

protocol:
  type: "mcp"
  version: "2024-11-05"
  transport:
    type: "stdio"
    command: "node"
    # Repo-relative: non-absolute args resolve against EMERGE_TOOLS_DIR
    # (see _resolve_stdio_cmd_args in the MCP handler). Run `npm run build`
    # in this directory first — dist/ is a build artifact, not checked in.
    args: ["agents/notion-mcp/dist/index.js"]
    env:
      NOTION_API_KEY: "${NOTION_API_KEY}"

# stdio MCP agents have no HTTP health endpoint; placeholder satisfies schema validation.
# Health probes will not succeed — use protocol.transport.command to verify liveness.
health_endpoint: "http://localhost:3010/health"

security:
  transport_layer:
    type: "none"
  auth_strategies: []

payment:
  enabled: false  # MCP agents are free — guard skips them by protocol

# MCP capabilities — harvested via MCP list_tools/list_resources at registration time;
# listed here for documentation and PnD embedding.
capabilities:
  tools:
    - name: "search_notion"
      description: "Search for pages and databases in the Notion workspace by query text. Returns matching results with titles and URLs."
      inputSchema:
        type: object
        properties:
          query:
            type: string
            description: "Search query text"
          filter:
            type: string
            enum: ["page", "database"]
            description: "Optionally restrict results to pages or databases only"
          page_size:
            type: integer
            description: "Number of results to return (max 100)"
            default: 10
        required:
          - query
      outputSchema:
        type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                type:
                  type: string
                title:
                  type: string
                url:
                  type: string

    - name: "get_page"
      description: "Retrieve a Notion page by its ID, returning all properties and optionally block content."
      inputSchema:
        type: object
        properties:
          page_id:
            type: string
            description: "Notion page ID (UUID format)"
          include_content:
            type: boolean
            description: "Whether to include block-level content"
            default: false
        required:
          - page_id
      outputSchema:
        type: object
        properties:
          id:
            type: string
          title:
            type: string
          url:
            type: string
          properties:
            type: object
          content:
            type: array
            description: "Block-level content (only if include_content=true)"

    - name: "create_page"
      description: "Create a new page in Notion under a parent page or inside a database."
      inputSchema:
        type: object
        properties:
          parent_id:
            type: string
            description: "Parent page ID or database ID to create the page under"
          parent_type:
            type: string
            enum: ["page_id", "database_id"]
            description: "Use 'page_id' when the parent is a page, 'database_id' when the parent is a database"
          title:
            type: string
            description: "Page title"
          properties:
            type: object
            description: "Additional Notion database properties (when parent_type is 'database_id')"
          content:
            type: string
            description: "Optional text content for the page body (paragraphs separated by blank lines)"
        required:
          - parent_id
          - parent_type
          - title
      outputSchema:
        type: object
        properties:
          id:
            type: string
          url:
            type: string
          title:
            type: string

    - name: "update_page"
      description: "Update properties of an existing Notion page (title, database fields, archived status)."
      inputSchema:
        type: object
        properties:
          page_id:
            type: string
            description: "Notion page ID to update"
          properties:
            type: object
            description: "Properties to update (key-value pairs)"
          archived:
            type: boolean
            description: "Set to true to archive the page"
        required:
          - page_id
      outputSchema:
        type: object
        properties:
          id:
            type: string
          url:
            type: string
          updated:
            type: boolean

    - name: "query_database"
      description: "Query a Notion database with optional filters and sorts. Returns matching page entries."
      inputSchema:
        type: object
        properties:
          database_id:
            type: string
            description: "Notion database ID to query"
          filter:
            type: object
            description: "Notion filter object (see Notion API docs)"
          sorts:
            type: array
            description: "Array of sort objects"
          page_size:
            type: integer
            description: "Number of results (max 100)"
            default: 20
        required:
          - database_id
      outputSchema:
        type: object
        properties:
          results:
            type: array
            items:
              type: object
          has_more:
            type: boolean
          next_cursor:
            type: string

  resources:
    - name: "page"
      description: "A Notion page identified by its ID"
      uri: "notion://pages/{pageId}"
      mimeType: "application/json"

    - name: "database"
      description: "A Notion database identified by its ID"
      uri: "notion://databases/{databaseId}"
      mimeType: "application/json"

  prompts:
    - name: "research_topic"
      description: "Generate a research plan and create a structured Notion page for a given topic"
      arguments:
        - name: "topic"
          description: "The research topic to investigate"
          required: true
        - name: "depth"
          description: "Research depth: brief, standard, or comprehensive"
          required: false

    - name: "meeting_notes"
      description: "Create a structured meeting notes page in Notion"
      arguments:
        - name: "meeting_title"
          description: "Title of the meeting"
          required: true
        - name: "attendees"
          description: "Comma-separated list of attendees"
          required: false
        - name: "database_id"
          description: "Optional database ID to store meeting notes in"
          required: false
