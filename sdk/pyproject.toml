[project]
name = "orcha-sdk"
version = "0.1.0"
description = "Orcha agent SDK + emerge CLI — register an agent in three lines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Orcha" }]
keywords = ["ai-agents", "mcp", "a2a", "orchestration", "orcha", "emerge"]
dependencies = [
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/solvent-labs-org/orcha"
Repository = "https://github.com/solvent-labs-org/orcha"
Issues = "https://github.com/solvent-labs-org/orcha/issues"

[project.scripts]
orcha-sdk = "emerge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emerge"]
