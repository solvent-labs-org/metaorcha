[project]
name = "attestation-playground"
version = "0.1.0"
description = "Local demo playground for RFC 0003 run attestation — run, tamper, verify."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "cryptography>=42",
  "common-kafka",
  "emerge-node",
  "orcha-sdk",
  "validator-service",
]

[tool.uv.sources]
common-kafka = {workspace = true}
emerge-node = {workspace = true}
orcha-sdk = {workspace = true}
validator-service = {workspace = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
