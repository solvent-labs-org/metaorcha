[project]
name = "metaorcha-app"
dynamic = ["version"]
description = "MetaBot, the app: run and watch your coding agents from a phone or a desktop window, with a signed receipt for every run."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Metaorcha" }]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]
# The server is standard library only. The MetaBot core (metabot / orcha commands) is
# found beside this interpreter or on PATH; the desktop app installs both together.
dependencies = []

[project.scripts]
metabot-app = "metabot_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/metabot_app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/metabot_app"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["src/metabot_app", "tests", "tools", "README.md", "pyproject.toml"]
exclude = ["**/__pycache__"]
