# E1 Android on-device payload: every artifact the APK ships, pinned. One per line:
#   <kind> <file> <sha256> <bytes> <source>
#
# kinds:
#   cpython   the official CPython Android runtime tarball (python.org)
#   wheel     pure-Python wheel, fetched from PyPI by name==version
#   sdist     source tarball whose pure package is shipped (PyPI)
#   launcher  the E0-a executable .so (calls Py_BytesMain; RUNPATH $ORIGIN; 16 KB
#             aligned), vendored at android/payload/launcher/ with its source main.c;
#             built once with the spike's partial NDK r27d pull. The NDK is not
#             approved for E1, so the pinned binary is reused; rebuilding wants that
#             pull approved first.
#   local     our own wheels, built from source at build time. No hash here — the
#             payload manifest (assets/py/payload.list) hashes what the APK ships.
#
# No Android wheels exist for cryptography / cffi (BeeWare index: iOS only; PyPI: no
# android tag) or pydantic-core / pyyaml (not in the BeeWare index). Checked
# 2026-11-10 (spike E0), re-checked 2026-11-12. pyyaml ships its pure package from
# the sdist; the Ed25519 signer is the app's own labelled pure-Python module
# (android/payload/crypto-pure-ed25519/, RFC 8032, v0 only); pydantic-core stays
# missing, so `mcp` is an optional extra on-device — the core is never patched.
